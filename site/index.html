<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="llm-wiki 的费曼式知识阅读库：按研究问题查找论文、重建机制、回看卡壳点。">
  <title>llm-wiki · 知识阅读库</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/wiki-slides.css?v=20260908-5">
</head>
<body>
<div class="idx-wrap">
  <header class="idx-header">
    <p class="idx-kicker">LLM-WIKI / READING LIBRARY</p>
    <h1>找到一个知识点，接着往下读</h1>
    <p class="idx-sub">按研究问题、机制或曾经卡住的地方查找。文章为连续阅读；速览未收录的细节有完整笔记页兜底。</p>
  </header>

  <section class="idx-search-panel" aria-label="知识库搜索与筛选">
    <input class="idx-filter" type="search" placeholder="搜索论文、机制或困惑，例如：y+、attention sink、流式 掩码" aria-label="搜索知识库">
    <div class="idx-topics" aria-label="研究专题">
      <button class="topic-filter" type="button" data-topic="all" aria-pressed="true">全部</button>
      <button class="topic-filter" type="button" data-topic="video-understanding" aria-pressed="false">视频理解与响应</button>
      <button class="topic-filter" type="button" data-topic="visual-encoders" aria-pressed="false">视觉编码器</button>
      <button class="topic-filter" type="button" data-topic="distillation" aria-pressed="false">蒸馏与训练预算</button>
      <button class="topic-filter" type="button" data-topic="structured-output" aria-pressed="false">结构化输出与定位</button>
    </div>
    <div class="idx-state">
      <span id="idx-count">9 篇可读</span>
      <span id="idx-state-label"></span>
      <span class="idx-search-hint">按 <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 清除</span>
      <button class="idx-clear" id="idx-clear" type="button" hidden>清除筛选</button>
    </div>
  </section>

  <main class="idx-main">
    <section class="idx-results" aria-live="polite">
      <noscript>
        <div class="idx-result-heading"><h2>按研究问题阅读</h2><span>9 篇</span></div>
        <article class="idx-card"><a class="idx-card-title" href="papers/2026-videochat3.html">VideoChat3</a><p class="idx-card-essence">4B 全开源 Video MLLM：在视觉编码器里压缩视频 token，再用状态机自适应处理流式视频。</p></article>
        <article class="idx-card"><a class="idx-card-title" href="papers/2026-vst.html">VST</a><p class="idx-card-essence">把 CoT 推理塞进视频流的等待空档，查询时直接读取 FIFO 文本记忆。</p></article>
        <article class="idx-card"><a class="idx-card-title" href="papers/2026-genlip.html">GenLIP</a><p class="idx-card-essence">让 ViT 直接预测文本 token，用生成式预训练改善视觉表示。</p></article>
        <article class="idx-card"><a class="idx-card-title" href="papers/2026-last-vit.html">LaSt-ViT</a><p class="idx-card-essence">用频域稳定性减少 ViT 的懒惰聚合，让 CLS 回到前景 patch。</p></article>
        <article class="idx-card"><a class="idx-card-title" href="papers/2026-video-o3.html">Video-o3</a><p class="idx-card-essence">像侦探一样主动找线索、裁剪放大并连接长视频证据。</p></article>
        <article class="idx-card"><a class="idx-card-title" href="papers/2026-u-opsd.html">U-OPSD</a><p class="idx-card-essence">模型自己投票造出教师轨迹，再用逐 token 前向 KL 做无监督自蒸馏。</p></article>
        <article class="idx-card"><a class="idx-card-title" href="papers/2026-open-mopd.html">Open-MOPD</a><p class="idx-card-essence">多教师蒸馏的核心问题是训练预算错配，而不是教师冲突。</p></article>
        <article class="idx-card"><a class="idx-card-title" href="papers/2026-s2vopd.html">S²VOPD</a><p class="idx-card-essence">故意弄坏学生输入，让看清原图的 EMA 教师提供免费不对称。</p></article>
        <article class="idx-card"><a class="idx-card-title" href="papers/2026-locateanything.html">LocateAnything</a><p class="idx-card-essence">把整个框当固定长块并行解码，减少坐标 token 的逐个等待。</p></article>
      </noscript>
    </section>

    <aside class="idx-side">
      <div class="idx-side-block">
        <h2>今天先做什么</h2>
        <div id="idx-due-entry" hidden><a href="?review=due">查看今天待复测</a></div>
        <button class="idx-recall-toggle" id="idx-recall-toggle" type="button" aria-pressed="false">先回忆</button>
        <p>回忆模式只显示论文标题：先凭记忆复述，再进入文章点「显示检验问题」逐题核对。</p>
      </div>
      <div class="idx-side-block">
        <h2>阅读方式</h2>
        <p>文章按自然滚动组织：左侧目录定位，右侧关系卡说明为什么值得继续读。</p>
        <p>速览是 Markdown 的提炼层；每篇都有完整笔记页（notes/），细节与原话都在那里。</p>
      </div>
    </aside>
  </main>

  <footer class="idx-foot">
    <span>9 篇 · 静态离线可用 · Markdown 是唯一真源</span>
    <a href="../docs/specs/site-reading-redesign.md">阅读改造说明</a>
  </footer>
</div>
<script src="assets/wiki-index.js?v=20260908-5"></script>
<script src="assets/wiki-slides.js?v=20260908-5"></script>
</body>
</html>
