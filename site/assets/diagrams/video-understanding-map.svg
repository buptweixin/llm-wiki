  </g>
  <g class="hs-group">
    <rect class="hs-node hs-node-q" x="350" y="148" width="300" height="58"/>
    <text class="hs-title" x="500" y="172" text-anchor="middle">思考时机</text>
    <text class="hs-sub" x="500" y="191" text-anchor="middle">查询前积累文本记忆</text>
  </g>
  <g class="hs-group">
    <rect class="hs-node hs-node-q" x="680" y="148" width="300" height="58"/>
    <text class="hs-title" x="830" y="172" text-anchor="middle">证据获取</text>
    <text class="hs-sub" x="830" y="191" text-anchor="middle">围绕问题主动裁剪细看</text>
  </g>
