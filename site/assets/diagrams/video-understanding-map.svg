  <text class="hs-edge-label" x="510" y="256">对应方法</text>
  <path class="hs-edge hs-edge-hi" d="M830 206 V298" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="840" y="256">对应方法</text>

  <g class="hs-group">
    <rect class="hs-node hs-node-root" x="340" y="20" width="320" height="58"/>
    <text class="hs-title" x="500" y="44" text-anchor="middle">视频理解</text>
    <text class="hs-sub" x="500" y="63" text-anchor="middle">感知、思考与证据获取</text>
  </g>
  <g class="hs-group">
