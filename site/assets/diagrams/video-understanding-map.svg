<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" class="hub-svg" role="group" aria-labelledby="hub-map-title hub-map-desc">
  <title id="hub-map-title">视频理解与响应：问题与方法地图</title>
  <desc id="hub-map-desc">专题分成三个并列子问题：感知成本（VideoChat3 在编码器内压缩并自适应分辨率）、思考时机（VST 查询前边看边想写入 FIFO 文本记忆）、证据获取（Video-o3 在共享上下文内多轮裁剪找线索并作答）。三条分支不是已验证的组合系统，也不表示先后。</desc>
  <defs>
    <marker id="hs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="hs-arrow"/>
    </marker>
  </defs>

  <path class="hs-edge" d="M420 78 V112 H170 V148" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="295" y="105" text-anchor="middle">问题分解</text>
  <path class="hs-edge" d="M500 78 V148" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="510" y="118">问题分解</text>
  <path class="hs-edge" d="M580 78 V112 H830 V148" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="705" y="105" text-anchor="middle">问题分解</text>

  <path class="hs-edge hs-edge-hi" d="M170 206 V298" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="180" y="256">对应方法</text>
