<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="../wiki-slides.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" class="hub-svg" role="group" aria-labelledby="hub-map-title hub-map-desc">
  <title id="hub-map-title">蒸馏与训练预算：问题与方法地图</title>
  <desc id="hub-map-desc">专题分成两个子问题：教师凭什么提供更有用的分布（U-OPSD 给教师加信息，S²VOPD 从学生减信息），多个教师的训练预算如何分配（Open-MOPD）。PPO 以虚线连到 Open-MOPD，表示理解前置而不是论文继承。</desc>
  <defs>
    <marker id="hs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="hs-arrow"/>
    </marker>
  </defs>

  <path class="hs-edge" d="M440 78 V112 H250 V148" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="345" y="105" text-anchor="middle">问题分解</text>
  <path class="hs-edge" d="M560 78 V112 H765 V148" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="662" y="105" text-anchor="middle">问题分解</text>

  <path class="hs-edge hs-edge-hi" d="M145 206 V298" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="155" y="256">文本信息差：给教师加信息</text>
  <path class="hs-edge hs-edge-hi" d="M415 206 V298" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="425" y="256">视觉信息差：从学生减信息</text>
  <path class="hs-edge hs-edge-hi" d="M765 206 V298" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="775" y="256">对应方法</text>
  <path class="hs-edge hs-edge-dash" d="M765 444 V364" marker-end="url(#hs-arrow)"/>
  <text class="hs-edge-label" x="775" y="408">理解前置：不是论文继承</text>

  <g class="hs-group">
    <rect class="hs-node hs-node-root" x="340" y="20" width="320" height="58"/>
    <text class="hs-title" x="500" y="44" text-anchor="middle">蒸馏</text>
    <text class="hs-sub" x="500" y="63" text-anchor="middle">教师信号与训练预算</text>
  </g>
  <g class="hs-group">
    <rect class="hs-node hs-node-q" x="60" y="148" width="380" height="58"/>
    <text class="hs-title" x="250" y="172" text-anchor="middle">教师凭什么提供更有用的分布？</text>
    <text class="hs-sub" x="250" y="191" text-anchor="middle">单教师的信息差从哪里来</text>
  </g>
  <g class="hs-group">
    <rect class="hs-node hs-node-q" x="590" y="148" width="350" height="58"/>
    <text class="hs-title" x="765" y="172" text-anchor="middle">多个教师的训练预算如何分配？</text>
    <text class="hs-sub" x="765" y="191" text-anchor="middle">合并训练为什么掉分</text>
  </g>
  <a href="../../topics/distillation.html#paper-2026-u-opsd" class="hs-link">
    <rect class="hs-node hs-node-paper" x="20" y="298" width="250" height="66"/>
    <text class="hs-title" x="145" y="324" text-anchor="middle">U-OPSD</text>
    <text class="hs-sub" x="145" y="345" text-anchor="middle">教师多看自投票的完整轨迹</text>
  </a>
  <a href="../../topics/distillation.html#paper-2026-s2vopd" class="hs-link">
    <rect class="hs-node hs-node-paper" x="290" y="298" width="250" height="66"/>
    <text class="hs-title" x="415" y="324" text-anchor="middle">S²VOPD</text>
    <text class="hs-sub" x="415" y="345" text-anchor="middle">教师看清晰图，学生看退化图</text>
  </a>
  <a href="../../topics/distillation.html#paper-2026-open-mopd" class="hs-link">
    <rect class="hs-node hs-node-paper" x="640" y="298" width="250" height="66"/>
    <text class="hs-title" x="765" y="324" text-anchor="middle">Open-MOPD</text>
    <text class="hs-sub" x="765" y="345" text-anchor="middle">修复多教师 token 预算错配</text>
  </a>
  <a href="../../topics/distillation.html#paper-2017-ppo" class="hs-link">
    <rect class="hs-node hs-node-ref" x="640" y="444" width="250" height="62"/>
    <text class="hs-title" x="765" y="468" text-anchor="middle">PPO（跨专题前置）</text>
    <text class="hs-sub" x="765" y="489" text-anchor="middle">重要性比率与 clip 是机制三的载体</text>
  </a>
</svg>
